# Run from the repository root; settings come from the env file next to it:
#   docker compose --env-file ../comments.env up -d --build
services:
  # Applies the migrations once before the backend starts, then exits.
  migrate:
    build: ./backend
    # The backend's image: the second build of it is all cache.
    image: comments-backend
    command: python manage.py migrate --noinput
    env_file: ../comments.env
    environment:
      REDIS_URL: redis://redis:6379/0
    depends_on:
      redis:
        condition: service_healthy
    restart: "no"

  backend:
    build: ./backend
    image: comments-backend
    env_file: ../comments.env
    environment:
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: &broker_url amqp://${RABBITMQ_USER:-comments}:${RABBITMQ_PASSWORD}@broker:5672//
      # Processes of uvicorn: one per core of the server. BACKEND_WORKERS=1 in the env file
      # brings back a single process, for comparison.
      WEB_CONCURRENCY: ${BACKEND_WORKERS:-2}
    depends_on:
      redis:
        condition: service_healthy
      broker:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped

  # Celery: deletes the files of comments that were not saved (comments/tasks.py). Such a
  # task is rare, so one process is plenty.
  worker:
    image: comments-backend
    command: >-
      celery -A config worker --concurrency 1 --loglevel WARNING
      --without-gossip --without-mingle --without-heartbeat
    env_file: ../comments.env
    environment:
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: *broker_url
    depends_on:
      redis:
        condition: service_healthy
      broker:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped

  frontend:
    build: ./frontend
    environment:
      MEDIA_BUCKET_URL: ${S3_ENDPOINT}/${S3_BUCKET}
      # Load tests only, like the backend's copy from the env file (perf/README.md).
      RATE_LIMIT_EXEMPT: ${RATE_LIMIT_EXEMPT:-127.0.0.1/32}
    ports:
      - "80:80"
    depends_on:
      - backend
    restart: unless-stopped

  # State every backend process must share: captchas, limits per IP, who watches what, the
  # channel layer. All of it may be lost, so nothing goes to disk, and a restart empties it.
  # Only keys with a lifetime are evicted when memory runs out, the newest ones last.
  redis:
    image: redis:8.2-alpine
    command: redis-server --save "" --appendonly no --maxmemory 256mb --maxmemory-policy volatile-lru
    mem_limit: 384m
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  # The Celery task queue.
  broker:
    image: rabbitmq:4.1-alpine
    # RabbitMQ keeps its data under the node name, which comes from the host name.
    hostname: broker
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-comments}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:?set RABBITMQ_PASSWORD in the env file}
      # Idle Erlang schedulers spin on the CPU by default; the server has two cores to share.
      RABBITMQ_SERVER_ADDITIONAL_ERL_ARGS: "+sbwt none +sbwtdcpu none +sbwtdio none"
    volumes:
      - broker-data:/var/lib/rabbitmq
    mem_limit: 512m
    # Every check starts an Erlang VM for the CLI, about a fifth of a core for a second, so
    # they are rare once the broker is up and frequent only while it starts.
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
      start_interval: 2s
    restart: unless-stopped

volumes:
  broker-data:
