# Docker's DNS: the backend gets a new IP whenever its container is recreated,
# so the name is resolved again instead of once at startup.
resolver 127.0.0.11 valid=10s ipv6=off;

upstream backend {
    zone backend 64k;
    server backend:8000 resolve;
}

# Files already fetched from the bucket: a popular one costs the bucket one request.
proxy_cache_path /var/cache/nginx/media keys_zone=media:10m max_size=1g inactive=7d use_temp_path=off;

# Only the characters of stored names reach the upstream URL: $uri is already decoded.
map $uri $media_object {
    default "";
    "~^/media/([A-Za-z0-9_./-]+)$" $1;
}

server {
    listen 80;
    server_name _;

    client_max_body_size 10m;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/css application/javascript application/json image/svg+xml text/plain;

    root /usr/share/nginx/html;
    index index.html;

    location /graphql/ {
        proxy_pass http://backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /admin/ {
        proxy_pass http://backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /ws/ {
        proxy_pass http://backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 1h;
    }

    location /media/ {
        root /srv;
        try_files $uri @media_bucket;
        add_header X-Content-Type-Options nosniff;
        # Uploads opened directly must not run anything, whatever slipped past the checks.
        add_header Content-Security-Policy "default-src 'none'; img-src 'self'; style-src 'unsafe-inline'; sandbox";
        expires 7d;
    }

    # A file not on the media volume comes from the bucket, when there is one (MEDIA_BUCKET_URL).
    location @media_bucket {
        set $media_bucket "${MEDIA_BUCKET_URL}";
        if ($media_bucket = "") {
            return 404;
        }
        if ($media_object = "") {
            return 404;
        }
        proxy_pass $media_bucket/$media_object;
        proxy_ssl_server_name on;
        proxy_ssl_verify on;
        proxy_ssl_verify_depth 3;
        proxy_ssl_trusted_certificate /etc/ssl/cert.pem;
        proxy_set_header Authorization "";
        proxy_set_header Cookie "";
        proxy_hide_header X-Content-Type-Options;
        proxy_cache media;
        proxy_cache_key $media_object;
        # Only 200: an image the worker has not finished yet is a 404 for a moment.
        proxy_cache_valid 200 7d;
        proxy_cache_lock on;
        proxy_cache_use_stale error timeout updating http_500 http_502 http_503 http_504;
        add_header X-Cache-Status $upstream_cache_status;
        add_header X-Content-Type-Options nosniff;
        add_header Content-Security-Policy "default-src 'none'; img-src 'self'; style-src 'unsafe-inline'; sandbox";
        expires 7d;
    }

    location /django-static/ {
        alias /srv/static/;
        expires 7d;
    }

    # Vite build output: file names carry a content hash, so they never change.
    # A missing file is a 404, not index.html cached for a year under its name.
    location /assets/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header X-Content-Type-Options nosniff;
    }

    location / {
        try_files $uri /index.html;
        # index.html names the current assets, so it is revalidated on every visit.
        add_header Cache-Control "no-cache";
        add_header X-Content-Type-Options nosniff always;
        # Comment HTML is sanitized on the server; this keeps anything that slips
        # through from running scripts or loading from elsewhere.
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data: blob:; connect-src 'self'; font-src 'self'; object-src 'none'; base-uri 'none'; form-action 'self'; frame-ancestors 'none'" always;
    }
}
